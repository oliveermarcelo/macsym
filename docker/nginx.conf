# Proxy da loja. O Node serve vitrine e API no mesmo processo, então aqui não
# há roteamento: tudo vai para ele.
#
# Enquanto o domínio não aponta para esta VPS, isto é HTTP puro no IP. Quando
# apontar, o certificado entra aqui (ver DEPLOY-VPS.md) — e só então
# SECURE_COOKIES=true no .env, porque cookie marcado como seguro não trafega
# em HTTP e o painel simplesmente não loga.

server {
    listen 80;
    server_name _;

    # Upload de foto de produto pelo painel. O padrão do nginx (1 MB) recusa
    # foto de celular, e o erro aparece como "falha ao enviar" sem explicação.
    client_max_body_size 25m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
