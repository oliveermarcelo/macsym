# Loja Macsym na VPS.
#
#   docker compose up -d --build
#   docker compose exec app node migrate.js --admin-email=... --admin-pass=...
#
# Três serviços: o banco, a loja (Node) e o nginx na frente. Só o nginx publica
# porta para fora; banco e aplicação conversam pela rede interna do compose e
# não ficam expostos na internet — o MariaDB do WordPress antigo estava assim
# também, e é o certo.

name: macsym

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      # Root com senha aleatória: ninguém precisa dela: a aplicação usa o
      # usuário acima, e o dump sai por ele.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Estes três mandam no que vier do .env: dentro do compose o banco tem
      # nome de serviço, e a aplicação precisa escutar em todas as interfaces
      # para o nginx alcançá-la.
      DB_HOST: db
      HOST: 0.0.0.0
      PORT: "8080"
      MIDIA_DIR: /app/midia
    volumes:
      - midia:/app/midia
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db:
  # As fotos enviadas pelo painel. Preserve este volume nos deploys e inclua no
  # backup: é o único lugar onde elas existem.
  midia:
