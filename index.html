<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#24282e" />
    <!-- A Content-Security-Policy é injetada APENAS no build de produção
         (ver vite.config.ts). Em dev fica aberta para o HMR do Vite. -->
    <title>Macsym — Câmeras PTZ, Microfones e Soluções para Videoconferência</title>
    <meta
      name="description"
      content="Câmeras PTZ, microfones, mesas controladoras e soluções completas de áudio e vídeo para reuniões, transmissões ao vivo e salas profissionais. Envio para todo o Brasil."
    />
    <link rel="canonical" href="https://camerasdevideo.com.br/" />

    <!-- Open Graph: define como o link aparece no WhatsApp, Facebook e Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Macsym" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Macsym — Câmeras PTZ, Microfones e Soluções para Videoconferência" />
    <meta
      property="og:description"
      content="Imagem profissional em cada reunião: câmeras PTZ com zoom óptico, microfones, mesas controladoras e acessórios de áudio e vídeo."
    />
    <meta property="og:url" content="https://camerasdevideo.com.br/" />
    <meta property="og:image" content="https://camerasdevideo.com.br/banners/hero-macsym.jpg" />
    <meta property="og:image:alt" content="Câmeras PTZ para videoconferência da Macsym" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Macsym — Câmeras PTZ, Microfones e Videoconferência" />
    <meta
      name="twitter:description"
      content="Câmeras PTZ, microfones e mesas controladoras para reuniões e transmissões profissionais."
    />
    <meta name="twitter:image" content="https://camerasdevideo.com.br/banners/hero-macsym.jpg" />

    <!--
      Dados estruturados (schema.org). Ajudam o Google a exibir nome, contato e
      a caixa de busca do site nos resultados. Como o conteúdo é renderizado no
      navegador, este bloco é o principal sinal legível por robôs.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Macsym Tecnologia Eletrônica",
        "description": "Câmeras PTZ, microfones, mesas controladoras e soluções de áudio e vídeo para videoconferência e transmissão ao vivo.",
        "url": "https://camerasdevideo.com.br/",
        "image": "https://camerasdevideo.com.br/banners/hero-macsym.jpg",
        "areaServed": "BR",
        "currenciesAccepted": "BRL",
        "paymentAccepted": "Pix, Cartão de crédito",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://camerasdevideo.com.br/?busca={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        <h1>Macsym</h1>
        <p>
          Esta loja precisa de JavaScript para funcionar. Ative-o no navegador ou fale conosco pelo
          e-mail <a href="mailto:contato@camerasdevideo.com.br">contato@camerasdevideo.com.br</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
